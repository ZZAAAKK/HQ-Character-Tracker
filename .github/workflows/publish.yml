name: Publish applications

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-windows:
    name: Publish Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install .NET MAUI workload
        run: dotnet workload install maui

      - name: Publish Windows app
        run: dotnet publish "HQ Character Tracker/HQ Character Tracker.csproj" -f net10.0-windows10.0.19041.0 -c Release -r win-x64 --self-contained true -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -o "${{ github.workspace }}/artifacts/windows-x64"

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/windows-x64/
          if-no-files-found: error

  publish-maccatalyst:
    name: Publish Mac Catalyst ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: maccatalyst-x64
          - arch: arm64
            rid: maccatalyst-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install .NET MAUI workload
        run: dotnet workload install maui

      - name: Publish Mac Catalyst app
        run: dotnet publish "HQ Character Tracker/HQ Character Tracker.csproj" -f net10.0-maccatalyst -c Release -r ${{ matrix.rid }} --self-contained true -p:EnableCodeSigning=false -o "${{ github.workspace }}/artifacts/macos-${{ matrix.arch }}"

      - name: Upload Mac Catalyst app
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: artifacts/macos-${{ matrix.arch }}/
          if-no-files-found: error
